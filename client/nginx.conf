server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Scrapes hit four upstream APIs in one request and can run well past nginx's
    # 60s default, which would surface as a 504 mid-scrape.
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        # Docker's embedded DNS, with the upstream held in a variable so nginx
        # resolves it per request instead of refusing to start when the API
        # container isn't up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://server:4100;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router uses history routing, so deep links like /leads must fall
    # back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
